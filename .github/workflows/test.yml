name: Run Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin123
          POSTGRES_DB: ragdb_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          path: app

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r app/requirements.txt

      - name: Enable pgvector extension
        run: |
          PGPASSWORD=admin123 psql -h localhost -p 5433 -U admin -d ragdb_test -c "CREATE EXTENSION vector;"

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
          DATABASE_URL: postgresql://admin:admin123@localhost:5433/ragdb_test
          TEST_DATABASE_URL: postgresql://admin:admin123@localhost:5433/ragdb_test
        run: pytest
